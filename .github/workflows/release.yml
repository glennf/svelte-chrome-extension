name: Create Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build extension
        run: npm run build
        
      - name: Package extension
        run: |
          cd public
          zip -r ../svelte-chrome-extension-${{ github.ref_name }}.zip .
          cd ..
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Svelte Chrome Extension ${{ github.ref_name }}
            
            Download the Chrome extension package below and load it as an unpacked extension in Chrome.
            
            ### Installation Instructions
            1. Download the `svelte-chrome-extension-${{ github.ref_name }}.zip` file
            2. Extract the ZIP file to a local directory
            3. Open Chrome and navigate to `chrome://extensions/`
            4. Enable "Developer mode" using the toggle in the top right corner
            5. Click "Load unpacked" and select the extracted directory
            
            ### Changes
            See the commit history for details of changes in this release.
          files: |
            svelte-chrome-extension-${{ github.ref_name }}.zip
          draft: false
          prerelease: false